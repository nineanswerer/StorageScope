[package]
name = "storagescope-desktop"
version = "0.3.0-beta.2"
edition = "2021"
description = "StorageScope 桌面端"

# Tauri 壳独立于根工作区（自己的 target 目录与构建脚本约定）
[workspace]

[lib]
name = "storagescope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
storagescope-core = { path = "../../../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

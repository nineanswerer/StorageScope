[package]
name = "storagescope-desktop"
version = "0.1.0"
edition = "2021"
description = "StorageScope 桌面端"

# Tauri 壳独立于根工作区（自己的 target 目录与构建脚本约定）
[workspace]

[lib]
name = "storagescope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storagescope-core = { path = "../../../core" }
